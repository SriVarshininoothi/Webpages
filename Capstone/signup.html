<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SignUp Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="./style.css">


</head>

<body>
    <div class="Signup-container ">
        <div class="signupborder">
            <a href="/Capstone/index.html"> <span class="close-btn">&times;</span></a>
            <div class="heading">
                <h1>SignUp</h1>
                <p>Already have an account? <a href="./login.html" style="text-decoration: none;">Login</a></p>
            </div>

            <div>


                <form>
                    <input type="text" placeholder="username" class="form-control" />
                    <br>
                    <input type="email" placeholder="Email" class="form-control" />
                    <br>
                    <input type="password" placeholder="password" class="form-control" />
                    <br>
                    <input type="password" placeholder="confirm-password" class="form-control" />
                    <br>
                    <button type="button" class="btn btn-danger" style="width: 100%;">SignUp</button>

                    <br>
                    <br>
                    <hr style="color: white;">
                    <div style="color: white; text-align: center;">
                        <p>or login with</p>
                    </div>


                    <div class="SocialLinks">
                        <button type="button" class="facebook">Facebook</button>
                        <button type="button" class="google">Google</button>
                        <button type="button" class="twitter">Twitter</button>
                    </div>

                </form>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
