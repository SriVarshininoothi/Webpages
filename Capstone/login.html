<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="./style.css">

</head>

<body>
    <div class="Signup-container">
        <div class="signupborder">
            <span class="close-btn">&times;</span>
            <div class="heading">
                <h1 style="font-size: 24px; padding: 12px;" class="text-center py-3">Login</h1>

            </div>

            <div>


                <form>

                    <input type="email" placeholder="Email/username" class="form-control" />
                    <br>
                    <input type="password" placeholder="password" class="form-control" />
                    <br>
                    <div class="text-end mb-3">
                        <a href="#" style="text-decoration:none;">Forgot Password?</a>
                    </div>

                    <button type="button"
                        style="width: 100%; color: white; background-color: green; font-size: 20px;">Login</button>

                    <br>
                    <br>
                    <hr style="color: white;">

                    <div style="color: white; text-align: center;">
                        <p>or login with</p>
                    </div>


                    <div class="SocialLinks">
                        <button type="button" class="facebook">Facebook</button>
                        <button type="button" class="google">Google</button>
                        <button type="button" class="twitter">Twitter</button>
                    </div>
                    <p class="text-center text-white mt-3">
                        Don't have an account?
                        <a href="./signup.html">Sign Up</a>
                    </p>

                </form>
            </div>
        </div>
    </div>

</body>

</html>
