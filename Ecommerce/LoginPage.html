<!DOCTYPE html>
<html>

<head>
    <title>SwiftCart</title>
    <link rel="stylesheet" href="./LoginPage.css">

</head>

<body>
    <div id="container">
        <div class="topcard">
            <nav class="navcard">

                <a href="#" class="logo">SwiftCart</a>
                <input type="search" placeholder="Search for products, brands and more...." class="search">

                <button class="btn" >Login</button>


                <span class="home">Home</span>


                <select value="more" class="sel">
                    <option value="">More</option>
                    <option>Notification Preference</option>
                    <option>24/7 Customer Support</option>
                    <option>Download App</option>
                </select>

                <span class="home">Cart</span>

                <div class="bg">
                    <div class="mid-card">
                        <h1>Sign up</h1>
                        <p>Sign up to continue</p>

                        <form class="form-up">
                            <label for="name">Name</label>
                            <input type="text" id="name" placeholder="Enter your name" class="in" />

                            <br><br>
                            <label for="mail">Email</label>
                            <input type="email" id="mail" placeholder="Enter your email" class="in" />
                            <br><br>

                            <label for="passwod">Password</label>
                            <input type="password" id="password" placeholder="Enter your password" class="in">
                            <br><br>
                            <label>Gender</label>
                            <input type="radio"/>
                            <label>Male</label>
                            <input type="radio" />
                            <label>Female</label>
                            <br><br>
                            <label for="calendar">Date.Of.Birth</label>
                            <input type="date" id="calendar" class="in" />
                            <br><br>

                            <label for="number">Phone Number</label>
                            <input type="number" id="number" placeholder="Enter your number" class="in" />
                            <br><br>
                            <label>State</label>
                            <select class="in">
                                <option>Select</option>
                                <option>Telangana</option>
                                <option>Andhra Pradesh</option>
                                <option>TamilNaidu</option>
                                <option>Karnataka</option>
                                <option>Keraka</option>
                                <option>Other</option>
                            </select>
                            <br><br>
                            <label>Country</label>
                            <select class="in">
                                <option>Select</option>
                                <option>India</option>
                                <option>Nepal</option>
                                <option>China</option>
                                <option>Japan</option>
                                <option>Korea</option>
                                <option>Austrila</option>
                                <option>America</option>
                                <option>Indonesia</option>
                                <option>Other</option>

                            </select>
                            <br><br>

                            <input type="checkbox">
                            <label>Remember me</label>
                            <br><br>
                            <button class="btn">Sign up</button>
                            <p>Have an account? <a href="#" style="text-decoration: none;">Log in</a></p>




                        </form>

                    </div>
                </div>

            </nav>

        </div>
    </div>
    <script>

    </script>
</body>

</html>
